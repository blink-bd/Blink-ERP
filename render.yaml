services:
  - type: web
    name: erp-api
    runtime: node
    plan: free
    # الجذر بقى المستودع كله (مش apps/api) عشان نبني الواجهة كمان
    # وتتقدم من نفس الخدمة على نفس الرابط — مفيش CORS ولا نشر واجهة منفصل.
    rootDir: .
    # سكربت البناء بيشتغل من أي Root Directory، وبيعيد المحاولة،
    # وبناء الواجهة جوّاه متسلسل واختياري (فشله ما يوقفش النشر).
    buildCommand: bash scripts/render-build.sh
    # migrations بإعادة محاولة + seed غير قاتل + تشغيل الـ API
    startCommand: bash scripts/start-production.sh
    # فحص حياة ما بيعتمدش على قاعدة البيانات: قاعدة نائمة/مقطوعة مش هتوقف النشر
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "true" # تقديم الواجهة من نفس الخدمة
      - key: DATABASE_URL
        sync: false # PostgreSQL خارجي؛ لا تحفظ قاعدة البيانات على قرص خدمة Render المجانية
      - key: FRONTEND_URL
        sync: false # أصل الواجهة المسموح له بإرسال Cookies مع credentials (لو الواجهة من نفس الخدمة: نفس رابط Render)
      - key: PUBLIC_APP_URL
        sync: false # رابط واجهة المستخدم لبناء روابط الإيصالات الإلكترونية
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_MASTER_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: AUTH_COOKIE_SAME_SITE
        value: none
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: WEBHOOK_ENCRYPTION_KEY
        generateValue: true
      - key: BACKUP_ALERT_TOKEN
        generateValue: true
      - key: REMINDERS_JOB_TOKEN
        generateValue: true
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_SECURE
        value: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false # Gmail App Password فقط؛ لا تستخدم كلمة مرور الحساب
      - key: MAIL_FROM
        value: blinkbusinessdevelopment@gmail.com
      - key: NOTIFICATION_EMAIL_TO
        value: blinkbusinessdevelopment@gmail.com
      - key: WHATSAPP_API_VERSION
        value: v26.0
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_TO
        value: +201024898091
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false # 12+ حرفاً: كبير وصغير ورقم ورمز
      - key: MASTER_ADMIN_NAME
        value: المدير العام
      - key: MASTER_2FA_ENCRYPTION_KEY
        generateValue: true  # تشفير أسرار المصادقة الثنائية — لا تغيّره بعد تفعيل 2FA
      - key: MASTER_ADMIN_ALLOWED_IPS
        sync: false        # اختياري: IPs مكتبك/بيتك فقط (مفصولة بفاصلة، يدعم CIDR)
      - key: TRUST_PROXY_HOPS
        value: "1"         # Render بيحط Proxy واحد قدام السيرفر
      - key: THROTTLE_LIMIT
        value: "300"
      # إعادة محاولة الاتصال بقاعدة البيانات عند الإقلاع (قاعدة مُدارة بتصحى في ~دقيقة)
      - key: DB_CONNECT_RETRIES
        value: "20"
      - key: DB_CONNECT_RETRY_DELAY_MS
        value: "5000"
